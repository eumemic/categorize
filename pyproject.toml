[project]
name = "categorize"
version = "0.1.0"
description = "A jev Choice question that grows its own options: an LLM writes a new one when none fits."
readme = "README.md"
authors = [
    { name = "eumemic", email = "eumemic@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.102.1",
    "typesafe-sdk>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: calls real APIs and costs money; run with `pytest -m live`"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-local-folder = ["fakes", "run_miss_eval"]
